name: Release Obsidian Plugin

# The release path. Releases are cut by pushing a semver tag:
#
#   bun run version:bump 0.2.0
#   git commit -am "chore(release): 0.2.0"
#   git tag 0.2.0 && git push origin main 0.2.0
#
# The tag must equal manifest.json's version — Obsidian's community-plugin
# tooling matches releases to the manifest by exact version, and a mismatch
# produces a release the directory cannot consume. The verify step below fails
# the run rather than publishing one.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  # A tag can point at any commit. Only a commit on main whose ci-required
  # check concluded success may be released; the gate reads that evidence
  # rather than re-running CI, and waits while CI on the commit is still
  # running, which it is when main and the tag are pushed together.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read # checkout, and compare the tagged commit with main
      checks: read # the ci-required check run on that commit
      actions: read # the CI workflow run, to tell "not yet" from "never"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tagged commit is on main and passed ci-required
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-gate.sh "$GITHUB_REPOSITORY" "$(git rev-parse 'HEAD^{commit}')"

  build:
    needs: gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest="$(node -p "require('./manifest.json').version")"
          plugin="$(node -p "require('./packages/obsidian/manifest.json').version")"

          if [ "$tag" != "$manifest" ] || [ "$tag" != "$plugin" ]; then
            echo "::error::Tag '$tag' does not match manifest.json ('$manifest') or packages/obsidian/manifest.json ('$plugin')."
            echo "Run 'bun run version:bump $tag', commit, then re-tag."
            exit 1
          fi

          if ! node -e "process.exit(require('./versions.json')['$tag'] ? 0 : 1)"; then
            echo "::error::versions.json has no entry for '$tag'. Run 'bun run version:bump $tag'."
            exit 1
          fi

          echo "Tag $tag matches both manifests and versions.json."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Package plugin
        run: bun run obsidian:package

      # The curated CHANGELOG.md section, not GitHub's generated list of merged
      # pull requests (#48). Fails the run when the section is missing or empty.
      - name: Release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF#refs/tags/}" > "$RUNNER_TEMP/release-notes.md"

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          # Create release if it doesn't exist, or upload to existing
          if gh release view "$tag" &>/dev/null; then
            gh release upload "$tag" \
              packages/obsidian/package/vaultore/main.js \
              packages/obsidian/package/vaultore/manifest.json \
              packages/obsidian/package/vaultore/styles.css \
              --clobber
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              packages/obsidian/package/vaultore/main.js \
              packages/obsidian/package/vaultore/manifest.json \
              packages/obsidian/package/vaultore/styles.css
          fi
