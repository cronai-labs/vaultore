version: 2

# This repository installs with `bun install --frozen-lockfile` in CI, so a
# dependency PR that edits package.json without regenerating bun.lock is
# guaranteed to fail. The `bun` ecosystem understands bun.lock and keeps the
# two in step; the default `npm` ecosystem does not, which is why the earlier
# dependabot PRs here left the lockfile stale.
updates:
  # A single directory, not one per package: the workspace has one root
  # bun.lock that already covers every member manifest, so listing
  # packages/* separately makes Dependabot open per-package PRs that touch a
  # package.json without the lockfile — all of which fail --frozen-lockfile.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # The PR title becomes the squash subject and must pass the policy job:
    # build(deps) and build(deps-dev), not the default chore(deps).
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    # Majors held back on purpose. Each entry names what has to change before
    # it is removed; checked with npm view on 2026-10-15.
    ignore:
      # eslint-plugin-obsidianmd (0.4.2) declares @eslint/js ^9.30.1 as a peer
      # and is not yet known to work with ESLint 10. Remove both entries once
      # a release of the plugin supports ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # @babel/parser 8 is ESM-only ("type": "module", no require export),
      # and @vaultore/core also ships a CommonJS build that requires it.
      # Revisit after the first release.
      - dependency-name: "@babel/parser"
        update-types: ["version-update:semver-major"]
      # Remove once tsup's type build and typescript-eslint run on TypeScript 7
      # (#195).
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    # Majors stay out of the group, so each arrives as its own PR.
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
