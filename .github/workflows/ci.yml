name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base: a stacked layer targets the layer
  # below it, and a filter on main left those layers with no CI at all.
  pull_request:
    # `edited` matters: the policy job lints the PR title and body, so it has to
    # re-run when either changes. `ready_for_review` re-runs the checklist step,
    # which is skipped while the PR is a draft.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

# CI only reads the repository: it checks out, installs and runs the gate.
# Nothing here publishes, comments, or writes back (CodeQL
# actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  # Enforces the merge discipline that GitHub has no setting for.
  #
  # Two of these rules exist because the platform cannot express them:
  #   - "Update with rebase" cannot be made the only option; the REST endpoint
  #     PUT /pulls/{n}/update-branch merges and takes no rebase parameter, and the
  #     UI dropdown ignores allow_merge_commit=false. So we detect the merge
  #     commit instead of preventing it.
  #   - A checklist in a PR template is a reminder, not a gate. Making it a
  #     required check is what turns it into one — auto-merge waits for required
  #     checks, so an unticked box cannot land.
  #
  # This job must never be skipped: a skipped required check blocks a PR forever
  # and stalls a merge queue. Individual STEPS are conditional; the job is not.
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # pull-requests: read lets the attribution check list the PR's commits.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Runs on every event, not only on pull requests. Covers job-level
      # `uses:` of reusable workflows too; local `./` references are exempt.
      - name: Actions are pinned to a full commit SHA
        run: |
          unpinned="$(grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows \
            | grep -vE 'uses:[[:space:]]*\./' \
            | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::Actions must be pinned to a 40-character commit SHA:"
            echo "$unpinned"
            exit 1
          fi
          echo "ok: every uses: is SHA-pinned"

      - name: PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The PR title becomes the squash subject and therefore the changelog
          # entry, which is why it is linted rather than the branch commits.
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "::error::PR title is not a Conventional Commit: '$TITLE'"
            echo "Expected e.g. 'fix(core): surface the cell error'. It becomes the squash commit subject."
            exit 1
          fi
          echo "ok: $TITLE"

      - name: Branch was rebased, not merged into
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          merges="$(git log --merges --oneline "origin/$BASE_REF..$HEAD_SHA")"
          if [ -n "$merges" ]; then
            echo "::error::This branch contains merge commits from its base."
            echo "$merges"
            echo ""
            echo "GitHub's 'Update branch' button defaults to a merge and cannot be"
            echo "restricted to rebase. Use instead:"
            echo "    git fetch origin && git rebase origin/$BASE_REF"
            echo "    git push --force-with-lease"
            exit 1
          fi
          echo "ok: no merge commits between origin/$BASE_REF and $HEAD_SHA"

      - name: Definition of done is complete
        # Skipped while the PR is a draft — a draft cannot merge, so unticked
        # boxes there are work in progress rather than a defect. Also skipped for
        # bots, which do not use the PR template.
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.draft == false
          && github.event.pull_request.user.type != 'Bot'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Blank out fenced code blocks before scanning: a PR that documents a
          # checklist, or pastes a diff containing one, must not be blocked by its
          # own example. Lines are blanked rather than removed so grep -n still
          # reports the real line number.
          unticked="$(printf '%s' "$BODY" \
            | awk '/^[[:space:]]*```/ { f = !f; print ""; next } f { print ""; next } { print }' \
            | grep -nE '^[[:space:]]*- \[ \]' || true)"
          if [ -n "$unticked" ]; then
            echo "::error::Unticked checkboxes remain in the PR description."
            echo "$unticked"
            echo ""
            echo "Tick them, or convert the PR back to a draft while the work continues."
            exit 1
          fi
          echo "ok: no unticked checkboxes"

      - name: No tool or model attribution
        # Owner rule: no AI co-author trailer and no "Generated with" line.
        # A branch commit's trailer or the PR body can reach main through the
        # squash. Commits come from the API, so checkout depth does not matter.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='^[[:space:]]*(co-authored-by:.*(claude|anthropic|copilot|openai|chatgpt|codex|gemini|cursor|aider|windsurf|devin)|.*generated (with|by) \[?(claude|copilot|chatgpt|codex|gemini|cursor|aider|windsurf|devin))'
          # Captured first, so a failed API call fails the step instead of
          # leaving nothing to check.
          commits="$(gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            --jq '.[] | "\(.sha[0:7])\t\(.commit.message | @base64)"')"
          hits=""
          while IFS=$'\t' read -r sha msg; do
            [ -n "$sha" ] || continue
            m="$(printf '%s' "$msg" | base64 -d | grep -inE "$pattern" || true)"
            if [ -n "$m" ]; then hits="${hits}commit ${sha}: ${m}"$'\n'; fi
          done <<< "$commits"
          # Fenced code blocks are blanked so a quoted example does not count.
          b="$(printf '%s' "$BODY" \
            | awk '/^[[:space:]]*```/ { f = !f; print ""; next } f { print ""; next } { print }' \
            | grep -inE "$pattern" || true)"
          if [ -n "$b" ]; then hits="${hits}PR body: ${b}"$'\n'; fi
          if [ -n "$hits" ]; then
            echo "::error::Tool or model attribution found:"
            printf '%s' "$hits"
            echo "Reword the commits (git rebase -i, then git push --force-with-lease) and edit the PR body."
            exit 1
          fi
          echo "ok: no tool or model attribution"

  # The condition sits on the steps, not on the job. A job-level `if` skips the
  # whole check on non-PR events, and a skipped required check blocks a PR
  # forever — see the policy job above.
  commitlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Setup Bun
        if: github.event_name == 'pull_request'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: bun install --frozen-lockfile

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # The release packages exactly this way; running it on every PR means a
      # packaging break shows up here and not first on a release tag (#42).
      - name: Package plugin
        run: bun run obsidian:package

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

  # The Obsidian community directory rebuilds the plugin from source and
  # compares the result with the released main.js, and anyone can do the same
  # to check a release against its tag. This builds twice from nothing, the
  # second time in a separate worktree at another path with its own install
  # and no turbo cache, and fails if main.js differs by a single byte.
  reproducible-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build twice and compare main.js
        env:
          TURBO_FORCE: "true"
        run: |
          set -euo pipefail
          bun run build
          first="$(sha256sum packages/obsidian/dist/main.js | cut -d' ' -f1)"

          rebuild="$RUNNER_TEMP/rebuild"
          git worktree add --detach "$rebuild" HEAD
          (cd "$rebuild" && bun install --frozen-lockfile && bun run build)
          second="$(sha256sum "$rebuild/packages/obsidian/dist/main.js" | cut -d' ' -f1)"

          echo "first build:  $first"
          echo "second build: $second"
          if [ "$first" != "$second" ]; then
            echo "::error::main.js differs between two clean builds of the same commit; the release could not be verified against its tag."
            exit 1
          fi
          echo "main.js sha256 \`$first\`, identical across two clean builds" >> "$GITHUB_STEP_SUMMARY"

  # The container integration tests: vaultRead and vaultWrite enforced at the
  # mount against a real Docker engine, which the mocked unit tests cannot
  # show (#73). GitHub's Ubuntu runners ship Docker.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The image the ore:ts and ore:shell cells run in (DEFAULT_RUNTIME in
      # packages/core/src/types/index.ts) and the one waitForContainerView in
      # packages/core/src/testing/integration-vault.ts reads the vault with.
      # Pulling them up front keeps
      # registry time out of the per-test timeouts, and a registry outage fails
      # here, named, instead of as a test failure. If a cell image changes and
      # this list does not, nothing breaks: the tests pull on demand.
      - name: Pull cell images
        run: |
          docker pull oven/bun:1-alpine
          docker pull alpine:3.19

      - name: Container integration tests
        env:
          VAULTORE_IT_ENGINE: docker
        run: bun run --cwd packages/core test:integration

  # Secret scan over the full history and a dependency audit. The audit's
  # threshold is a decision: docs/decisions/dependency-audit-scope.md.
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install gitleaks (checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Secret scan (full history)
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'

      # Reads bun.lock only; no install needed.
      - name: Dependency audit
        run: bun run audit

  # The one check the main ruleset should require. Every gate above feeds it,
  # so adding or renaming a job never means editing the ruleset.
  #
  # `if: always()` makes it run, and report, even when a dependency failed or
  # was cancelled; without it this job would be skipped, and a skipped job
  # reports success. It never carries any other condition. The step fails
  # unless every dependency's result is exactly `success`: failure, cancelled
  # and skipped all fail it.
  ci-required:
    if: always()
    needs: [policy, commitlint, build-and-test, integration, reproducible-build, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null
